# ==============================================================================
#                               TempFly Messages & Language
# ==============================================================================
# Supports modern MiniMessage formatting (<color>, <gradient:#color1:#color2>, <bold>, etc.)
# ==============================================================================

system:
  prefix: "<#4FD2FC><bold>FLIGHT</bold></#4FD2FC> <dark_gray>▶</dark_gray>"
  reload: "{PREFIX} <#00f878>Configuration, aesthetic settings, and data repositories reloaded successfully.</#00f878>"
  help:
    - " <#4FD2FC><bold>TEMPFLY FLIGHT HELP</bold></#4FD2FC>"
    - " <#4FD2FC>●</#4FD2FC> <white>/tf</white> <dark_gray>|</dark_gray> <gray>Toggle your temporary flight mode</gray>"
    - " <#4FD2FC>●</#4FD2FC> <white>/tf time [player]</white> <dark_gray>|</dark_gray> <gray>Check flight balance and remaining time</gray>"
    - " <#4FD2FC>●</#4FD2FC> <white>/tf pay <player> <time></white> <dark_gray>|</dark_gray> <gray>Transfer flight time to another player</gray>"
    - " <#4FD2FC>●</#4FD2FC> <white>/tf speed <amount> [player]</white> <dark_gray>|</dark_gray> <gray>Adjust flight speed</gray>"
  help_extended:
    - " <#4FD2FC><bold>ADMINISTRATION COMMANDS</bold></#4FD2FC>"
    - " <#4FD2FC>●</#4FD2FC> <white>/tf give <player> <time></white> <dark_gray>|</dark_gray> <gray>Grant flight time to a player</gray>"
    - " <#4FD2FC>●</#4FD2FC> <white>/tf giveall <time></white> <dark_gray>|</dark_gray> <gray>Grant flight time to all online players</gray>"
    - " <#4FD2FC>●</#4FD2FC> <white>/tf remove <player> <time></white> <dark_gray>|</dark_gray> <gray>Deduct flight time from a player</gray>"
    - " <#4FD2FC>●</#4FD2FC> <white>/tf set <player> <time></white> <dark_gray>|</dark_gray> <gray>Set exact flight balance for a player</gray>"
    - " <#4FD2FC>●</#4FD2FC> <white>/tf bypass [player]</white> <dark_gray>|</dark_gray> <gray>Toggle requirement bypass mode</gray>"
    - " <#4FD2FC>●</#4FD2FC> <white>/tf settrail <trail> [player]</white> <dark_gray>|</dark_gray> <gray>Set cosmetic particle flight trail</gray>"
    - " <#4FD2FC>●</#4FD2FC> <white>/tf trailremove [player]</white> <dark_gray>|</dark_gray> <gray>Clear cosmetic particle flight trail</gray>"
    - " <#4FD2FC>●</#4FD2FC> <white>/tf reload</white> <dark_gray>|</dark_gray> <gray>Reload configuration and hooks</gray>"

general:

  unit:
    seconds: "s"
    minutes: "m"
    hours: "h"
    days: "d"

  invalid:
    time_other: "{PREFIX} <red><white>{PLAYER}</white> does not have any flight time remaining!</red>"
    time_self: "{PREFIX} <red>You do not have any flight time remaining!</red>"
    number: "{PREFIX} <red><white>{NUMBER}</white> is not a valid number!</red>"
    particle: "{PREFIX} <red><white>{PARTICLE}</white> is not a valid particle effect!</red>"
    player: "{PREFIX} <red>The player <white>{PLAYER}</white> could not be found.</red>"
    permission: "{PREFIX} <red>You do not have permission to execute this command.</red>"
    command: "<red>Unknown command. Type <white>/tf help</white> for available commands.</red>"
    reciever: "{PREFIX} <red>You cannot send flight time to yourself!</red>"
    sender: "{PREFIX} <red>This command can only be executed by in-game players.</red>"
    flyer_self: "{PREFIX} <red>You are not currently flying!</red>"
    vault_perms: "{PREFIX} <red>Vault is required to manage offline player flight balances.</red>"

  time:
    format: "{QUANTITY}{UNIT}"
    given_other: "{PREFIX} <gray>Player <white>{PLAYER}</white> received <#00f878>{FORMATTED_TIME}</#00f878> of flight time.</gray>"
    given_all: "{PREFIX} <gray>Granted <#00f878>{FORMATTED_TIME}</#00f878> of flight time to <bold>ALL</bold> online players.</gray>"
    given_self: "{PREFIX} <gray>You received <#00f878>{FORMATTED_TIME}</#00f878> of flight time.</gray>"
    removed_other: "{PREFIX} <gray>Deducted <red>{FORMATTED_TIME}</red> of flight time from <white>{PLAYER}</white>.</gray>"
    removed_self: "{PREFIX} <gray>You lost <red>{FORMATTED_TIME}</red> of flight time.</gray>"
    sent_other: "{PREFIX} <gray>Sent <#00f878>{FORMATTED_TIME}</#00f878> of flight time to <white>{PLAYER}</white>.</gray>"
    sent_self: "{PREFIX} <gray><white>{PLAYER}</white> sent you <#00f878>{FORMATTED_TIME}</#00f878> of flight time.</gray>"
    set_other: "{PREFIX} <gray>Set <white>{PLAYER}</white>'s flight balance to <#00f878>{FORMATTED_TIME}</#00f878>.</gray>"
    set_self: "{PREFIX} <gray>Your flight balance was set to <#00f878>{FORMATTED_TIME}</#00f878>.</gray>"
    max_other: "{PREFIX} <red><white>{PLAYER}</white> has reached the maximum allowed flight balance!</red>"
    max_self: "{PREFIX} <red>You have reached your maximum allowed flight balance!</red>"
    decay: "{PREFIX} <red>Deducted <white>{FORMATTED_TIME}</white> of flight time due to offline inactivity.</red>"
    first_join: "{PREFIX} <gray>Welcome! You received <#00f878>{FORMATTED_TIME}</#00f878> of flight time. Toggle flight using <white>/tf</white>.</gray>"
    daily_login: "{PREFIX} <gray>You received your daily flight bonus of <#00f878>{FORMATTED_TIME}</#00f878>!</gray>"

  info:
    header: "<#4FD2FC><strikethrough>========================================</strikethrough></#4FD2FC>"
    player: " <#4FD2FC>●</#4FD2FC> <gray>Player:</gray> <yellow>{PLAYER}</yellow>"
    infinite: " <#4FD2FC>●</#4FD2FC> <gray>Status:</gray> <#00f878>Infinite Flight Enabled</#00f878>"
    days: " <#4FD2FC>●</#4FD2FC> <gray>Days:</gray> <yellow>{DAYS}</yellow>"
    hours: " <#4FD2FC>●</#4FD2FC> <gray>Hours:</gray> <yellow>{HOURS}</yellow>"
    minutes: " <#4FD2FC>●</#4FD2FC> <gray>Minutes:</gray> <yellow>{MINUTES}</yellow>"
    seconds: " <#4FD2FC>●</#4FD2FC> <gray>Seconds:</gray> <yellow>{SECONDS}</yellow>"
    footer: "<#4FD2FC><strikethrough>========================================</strikethrough></#4FD2FC>"

  fly:
    enabled_other: "{PREFIX} <gray>Flight enabled for <white>{PLAYER}</white>.</gray>"
    enabled_self: "{PREFIX} <#00f878>Flight mode enabled!</#00f878>"
    disabled_other: "{PREFIX} <gray>Flight disabled for <white>{PLAYER}</white>.</gray>"
    disabled_self: "{PREFIX} <red>Flight mode disabled!</red>"
    speed_other: "{PREFIX} <gray>Flight speed for <white>{PLAYER}</white> set to <#00f878>{SPEED}</#00f878>.</gray>"
    speed_self: "{PREFIX} <gray>Your flight speed was set to <#00f878>{SPEED}</#00f878>.</gray>"
    speed_limit_other: "{PREFIX} <red><white>{PLAYER}</white>'s flight speed is currently capped at <white>{SPEED}</white>.</red>"
    speed_limit_self: "{PREFIX} <red>Your flight speed is currently capped at <white>{SPEED}</white> in this area.</red>"
    speed_restricted: "{PREFIX} <red>You do not have permission to alter flight speed.</red>"
    already_enabled: "{PREFIX} <yellow>Your flight is already active!</yellow>"
    already_disabled: "{PREFIX} <yellow>Your flight is already inactive!</yellow>"
    idle_drop: "{PREFIX} <red>Flight disabled due to inactivity.</red>"
    idle: "{PREFIX} <yellow>You are now marked as idle.</yellow>"
    bypass_enabled: "{PREFIX} <#00f878>Flight requirement bypass mode activated!</#00f878>"
    bypass_disabled: "{PREFIX} <red>Flight requirement bypass mode deactivated.</red>"

  requirement:
    fail:
      default_other: "{PREFIX} <red><white>{PLAYER}</white> cannot currently fly in this location.</red>"
      default: "{PREFIX} <red>You do not meet the flight requirements for this area.</red>"
      region: "{PREFIX} <red>Flight is disabled in this region!</red>"
      world: "{PREFIX} <red>Flight is disabled in this world!</red>"
      combat: "{PREFIX} <red>You cannot fly while combat tagged!</red>"
      height: "{PREFIX} <red>Altitude limit reached! Maximum flight altitude is <white>{MAX_Y}</white>.</red>"
      structure: "{PREFIX} <red>Flight is restricted near this structure!</red>"
    pass:
      default: "{PREFIX} <#00f878>Flight requirements satisfied. You may now fly!</#00f878>"
      combat: "{PREFIX} <#00f878>Combat tag expired. Flight restored!</#00f878>"

aesthetic:
  # Action bar message displayed to active flyers
  action_bar:
    text: "<#4FD2FC>✈ <white>Flight:</white> <#4FD2FC>{FORMATTED_TIME}</#4FD2FC>"

  # Flight expiration title/subtitle warnings
  warning:
    title: "<red><bold>WARNING!</bold></red>"
    subtitle: "<yellow>You have <white>{FORMATTED_TIME}</white> of flight remaining!</yellow>"

  # Cosmetic particle trail messages
  trail:
    removed_self: "{PREFIX} <gray>Your particle trail was removed.</gray>"
    removed_other: "{PREFIX} <gray>Particle trail removed for <white>{PLAYER}</white>.</gray>"
    set_self: "{PREFIX} <gray>Your particle trail was set to <#00f878>{PARTICLE}</#00f878>!</gray>"
    set_other: "{PREFIX} <gray>Particle trail for <white>{PLAYER}</white> set to <#00f878>{PARTICLE}</#00f878>.</gray>"

  # Custom symbols and PlaceholderAPI configuration
  symbols:
    infinity: "∞"

  placeholders:
    infinite_yes: "∞"
    infinite_no: ""
    flying_yes: "true"
    flying_no: "false"
    unknown_user: "0s"
    invalid: ""
    # Granular time formatting for placeholders (%tempfly_time_formatted%) and {FORMATTED_TIME}
    time:
      days: "<yellow>{DAYS}</yellow><gray>d</gray> "
      hours: "<yellow>{HOURS}</yellow><gray>h</gray> "
      minutes: "<yellow>{MINUTES}</yellow><gray>m</gray> "
      seconds: "<yellow>{SECONDS}</yellow><gray>s</gray>"

command:
  unit:
    seconds:
      tab_complete: "second"
      recognized:
        - "s"
        - "sec"
        - "second"
        - "seconds"
    minutes:
      tab_complete: "minute"
      recognized:
        - "m"
        - "min"
        - "minute"
        - "minutes"
    hours:
      tab_complete: "hour"
      recognized:
        - "h"
        - "hour"
        - "hours"
    days:
      tab_complete: "day"
      recognized:
        - "d"
        - "day"
        - "days"

  base:
    give:
      - "give"
      - "add"
    give_all:
      - "giveall"
      - "givall"
      - "addall"
    reload:
      - "reload"
      - "rl"
    remove:
      - "remove"
      - "take"
    set:
      - "set"
    trail_remove:
      - "remove_trail"
      - "trailremove"
    trail_set:
      - "set_trail"
      - "settrail"
      - "trail"
    bypass:
      - "bypass"
      - "bp"
    fly:
      - "toggle"
      - "fly"
    help:
      - "help"
      - "commands"
    pay:
      - "pay"
      - "send"
    speed:
      - "speed"
      - "sp"
    time:
      - "time"
      - "bal"
      - "balance"
    migrate:
      - "migrate"

  enable:
    - "on"
    - "enable"
  disable:
    - "off"
    - "disable"

  syntax_error:
    cmd_fly:
      toggle_other: "<red>Usage: /tf [player] [on|off]</red>"
      toggle_self: "<red>Usage: /tf [on|off]</red>"